name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not decoration. The content hash pins its line terminator
        # because `to_csv` resolves an unset one to os.linesep, so the same
        # table used to hash differently on the two platforms and every cache
        # failed its own integrity check when moved between them.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: The package cannot fabricate an observation
        run: python -m pytest tests/test_no_fabrication.py -q
